<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class feedback</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f1ec; color: #1f1e1c; }
  .card { max-width: 440px; margin: 0 auto; min-height: 100vh; background: #fff; padding: 28px 20px 32px; }
  @media (min-width: 480px) { .card { margin: 24px auto; min-height: 0; border-radius: 24px; border: 1px solid #e2e0d9; } }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; line-height: 1.3; }
  .sub { font-size: 14px; color: #6b6a65; margin: 0 0 20px; }
  .rate { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; border: 2px solid transparent; border-radius: 12px; padding: 6px 3px; background: none; font: inherit; color: inherit; transition: opacity .15s, border-color .15s, background .15s; -webkit-tap-highlight-color: transparent; }
  .opt .num { width: 100%; text-align: center; font-size: 17px; font-weight: 600; padding: 7px 0; border: 1px solid #d9d7d0; border-radius: 8px; }
  .opt img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; display: block; }
  .rate.picked .opt { opacity: .4; }
  .rate.picked .opt.sel { opacity: 1; border-color: #534ab7; background: #eeedfe; }
  .opt.sel .num { background: #534ab7; color: #fff; border-color: #534ab7; }
  .ends { display: flex; justify-content: space-between; font-size: 12px; color: #9a9890; margin: 6px 4px 22px; }
  label { font-size: 15px; color: #6b6a65; display: block; margin-bottom: 6px; }
  textarea { width: 100%; height: 120px; border: 1px solid #d9d7d0; border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 16px; resize: vertical; }
  textarea:focus { outline: 2px solid #7f77dd; border-color: transparent; }
  .count { text-align: right; font-size: 12px; color: #9a9890; margin-top: 4px; }
  .send { margin-top: 14px; width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #1f1e1c; color: #fff; font-size: 17px; font-weight: 600; cursor: pointer; }
  .send:disabled { opacity: .6; cursor: default; }
  .err { color: #a32d2d; font-size: 14px; margin-top: 10px; min-height: 1em; }
  .done { text-align: center; padding-top: 40px; }
  .done img { width: 140px; height: 140px; border-radius: 16px; object-fit: cover; }
  .done h1 { margin-top: 18px; }
  .again { margin-top: 18px; background: none; border: 1px solid #d9d7d0; border-radius: 10px; padding: 11px 18px; font: inherit; font-size: 15px; cursor: pointer; color: #1f1e1c; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <form id="form" novalidate>
    <h1 id="question"></h1>
    <p class="sub">Your answer is anonymous. Give a rating, a comment, or both.</p>
    <div class="rate" id="rate" role="radiogroup" aria-label="Rating from 1 to 5"></div>
    <div class="ends"><span>1 = worst</span><span>5 = best</span></div>
    <label for="comment">Comments (optional)</label>
    <textarea id="comment" maxlength="500" placeholder="You can let me know what you think, don't worry it is anonymous"></textarea>
    <div class="count"><span id="chars">0</span>/500</div>
    <button class="send" id="send" type="submit">Send feedback</button>
    <div class="err" id="err" role="alert"></div>
  </form>

  <div class="done" id="done" hidden>
    <img id="doneGif" src="" alt="">
    <h1>Thank you!</h1>
    <p class="sub">Your feedback has been sent.</p>
    <button class="again" id="again" type="button">Send another response</button>
  </div>
</div>

<script src="config.js"></script>
<script>
const GIFS = ["gifs/1.gif", "gifs/2.gif", "gifs/3.gif", "gifs/4.gif", "gifs/5.gif"];
document.getElementById('question').textContent = QUESTION;

let picked = 0;
const rate = document.getElementById('rate');
const err = document.getElementById('err');
const comment = document.getElementById('comment');
const send = document.getElementById('send');

rate.innerHTML = GIFS.map((g, i) =>
  `<button type="button" class="opt" role="radio" aria-checked="false" data-r="${i + 1}" aria-label="${i + 1}">
     <span class="num">${i + 1}</span><img src="${g}" alt="">
   </button>`).join('');

rate.addEventListener('click', e => {
  const o = e.target.closest('.opt');
  if (!o) return;
  // Tap the selected rating again to clear it (rating is optional)
  picked = picked === Number(o.dataset.r) ? 0 : Number(o.dataset.r);
  rate.classList.toggle('picked', picked > 0);
  rate.querySelectorAll('.opt').forEach(x => {
    const on = picked > 0 && x === o;
    x.classList.toggle('sel', on);
    x.setAttribute('aria-checked', on ? 'true' : 'false');
  });
  err.textContent = '';
});

comment.addEventListener('input', () => {
  document.getElementById('chars').textContent = comment.value.length;
  err.textContent = '';
});

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  if (!picked && !comment.value.trim()) { err.textContent = 'Give a rating or a comment first.'; return; }
  if (!API_URL || API_URL.includes('PASTE_')) { err.textContent = 'This form is not connected yet. Ask your teacher to set the web app URL in config.js.'; return; }
  send.disabled = true;
  send.textContent = 'Sending…';
  err.textContent = '';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'submit', rating: picked || null, comment: comment.value.trim() })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Something went wrong');
    const doneGif = document.getElementById('doneGif');
    doneGif.hidden = !picked;
    if (picked) doneGif.src = GIFS[picked - 1];
    document.getElementById('form').hidden = true;
    document.getElementById('done').hidden = false;
  } catch (ex) {
    err.textContent = "Couldn't send. Check your internet and try again.";
  } finally {
    send.disabled = false;
    send.textContent = 'Send feedback';
  }
});

document.getElementById('again').addEventListener('click', () => {
  picked = 0;
  comment.value = '';
  document.getElementById('chars').textContent = '0';
  rate.classList.remove('picked');
  rate.querySelectorAll('.opt').forEach(x => { x.classList.remove('sel'); x.setAttribute('aria-checked', 'false'); });
  document.getElementById('done').hidden = true;
  document.getElementById('form').hidden = false;
});
</script>
</body>
</html>
